name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Universal App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build DisplayAnchor.app
        run: |
          chmod +x build.sh
          ./build.sh </dev/null

      - name: Verify Universal Binary (arm64 & x86_64)
        run: |
          lipo -info build/DisplayAnchor.app/Contents/MacOS/DisplayAnchor

      - name: Package .zip archive
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist 2>/dev/null || echo "1.0.0")
          ZIP_NAME="DisplayAnchor-${VERSION}.zip"
          ditto -c -k --keepParent "build/DisplayAnchor.app" "build/${ZIP_NAME}"
          cp "build/${ZIP_NAME}" "build/DisplayAnchor.zip"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DisplayAnchor-Universal
          path: build/DisplayAnchor.zip
          if-no-files-found: error

      - name: Create / Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: build/${{ env.ZIP_NAME }}
          generate_release_notes: true
